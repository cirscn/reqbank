name: test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 逐套件分步：step 级结论无需日志即可定位失败面（Windows 调试期特别有用）。
      # 本地等价命令仍是 npm test。bpms 夹具相关用例在无夹具环境自动跳过。
      - name: p0 回归
        shell: bash
        run: node eval/p0-regression.mjs
      - name: p1 回归
        shell: bash
        run: node eval/p1-regression.mjs
      - name: p2 回归
        shell: bash
        run: node eval/p2-regression.mjs
      - name: p3p4 回归
        shell: bash
        run: node eval/p3p4-regression.mjs
      - name: 对抗评测
        shell: bash
        run: node eval/adversarial.mjs
      - name: smoke
        shell: bash
        run: node scripts/smoke.mjs

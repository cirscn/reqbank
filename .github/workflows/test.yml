name: test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 逐套件分步 + 失败尾巴打成 annotation（公开 API 可读，免日志权限定位 Windows 失败面）。
      # 本地等价命令仍是 npm test。bpms 夹具相关用例在无夹具环境自动跳过。
      - name: p0 回归
        shell: bash
        run: |
          node eval/p0-regression.mjs > /tmp/s.log 2>&1; rc=$?
          if [ $rc -ne 0 ]; then echo "::error title=p0-fail::$(tail -c 600 /tmp/s.log | tr '\n' '|' | tr -d '\r')"; fi
          exit $rc
      - name: p1 回归
        shell: bash
        run: |
          node eval/p1-regression.mjs > /tmp/s.log 2>&1; rc=$?
          if [ $rc -ne 0 ]; then echo "::error title=p1-fail::$(tail -c 600 /tmp/s.log | tr '\n' '|' | tr -d '\r')"; fi
          exit $rc
      - name: p2 回归
        shell: bash
        run: |
          node eval/p2-regression.mjs > /tmp/s.log 2>&1; rc=$?
          if [ $rc -ne 0 ]; then echo "::error title=p2-fail::$(tail -c 600 /tmp/s.log | tr '\n' '|' | tr -d '\r')"; fi
          exit $rc
      - name: p3p4 回归
        shell: bash
        run: |
          node eval/p3p4-regression.mjs > /tmp/s.log 2>&1; rc=$?
          if [ $rc -ne 0 ]; then echo "::error title=p3p4-fail::$(tail -c 600 /tmp/s.log | tr '\n' '|' | tr -d '\r')"; fi
          exit $rc
      - name: 对抗评测
        shell: bash
        run: |
          node eval/adversarial.mjs > /tmp/s.log 2>&1; rc=$?
          if [ $rc -ne 0 ]; then echo "::error title=adv-fail::$(tail -c 600 /tmp/s.log | tr '\n' '|' | tr -d '\r')"; fi
          exit $rc
      - name: smoke
        shell: bash
        run: |
          node scripts/smoke.mjs > /tmp/s.log 2>&1; rc=$?
          if [ $rc -ne 0 ]; then echo "::error title=smoke-fail::$(tail -c 600 /tmp/s.log | tr '\n' '|' | tr -d '\r')"; fi
          exit $rc

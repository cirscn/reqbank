name: Publish

# 打 tag 即发布：git tag v0.X.Y && git push origin v0.X.Y
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'

      # OIDC 发布需要 npm >= 11.5.1（Node 22 自带的 npm 版本偏旧）
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: 版本一致性校验（tag = package.json = VERSION）
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          FILE="$(cat VERSION | tr -d '[:space:]')"
          test "$TAG" = "$PKG" || { echo "::error::tag v$TAG != package.json $PKG"; exit 1; }
          test "$TAG" = "$FILE" || { echo "::error::tag v$TAG != VERSION $FILE"; exit 1; }
          echo "releasing @$PKG"

      - name: Smoke
        run: node scripts/smoke.mjs

      # setup-node 会写入含 ${NODE_AUTH_TOKEN} 占位符的 .npmrc；
      # 未配置该 Secret 时占位符原样发出会导致 404——发布前重置为纯净配置，走 OIDC。
      - name: Reset .npmrc for OIDC
        run: echo "registry=https://registry.npmjs.org/" > ~/.npmrc

      - name: Publish to npm（零凭据，带溯源签名）
        run: npm publish --access public --provenance

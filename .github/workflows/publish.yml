name: Publish

# 打 tag 即发布：git tag v0.X.Y && git push origin v0.X.Y
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'

      - name: 版本一致性校验（tag = package.json = VERSION）
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          FILE="$(cat VERSION | tr -d '[:space:]')"
          test "$TAG" = "$PKG" || { echo "::error::tag v$TAG != package.json $PKG"; exit 1; }
          test "$TAG" = "$FILE" || { echo "::error::tag v$TAG != VERSION $FILE"; exit 1; }
          echo "releasing @$PKG"

      - name: Smoke
        run: node scripts/smoke.mjs

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
